[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "magehand"
version = "0.1.1"
description = "The developer CLI for building apps on davidlarrimore's homelab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/davidlarrimore/magehand"

[project.scripts]
magehand = "magehand.cli:main"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
