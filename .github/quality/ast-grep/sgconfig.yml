# The platform's own rules (ast-grep, MIT; homelab#611): bug patterns found in this lab, each with the issue it
# came from. scan.py runs them on the files pre-commit passes; `ast-grep test -c` runs rule-tests/.
# A finding that is right where it is: `# ast-grep-ignore: <rule-id>` on the line above, with the reason.
ruleDirs: [rules]
testConfigs:
  - testDir: rule-tests
